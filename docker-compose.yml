services:
  # web:
  #   build: ./web
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - db

  web:
    build: ./web
    container_name: cyber-web
    ports:
      - "8081:80"
    volumes:
      # Lets spawn.php drive the host Docker daemon to launch challenge
      # instances. NOTE: this grants the web container host-root-equivalent
      # access — keep the spawn allowlist (challenge_map.php) strict.
      - /var/run/docker.sock:/var/run/docker.sock
    # Optional: host/IP students use to reach spawned instances. Defaults to the
    # request host. Set this if instances must be reached on a different address.
    # environment:
    #   CTF_INSTANCE_HOST: "192.168.1.10"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: cyber-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cyber
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
